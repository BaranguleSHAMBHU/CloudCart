spring:
  application:
    name: cloudcart
  datasource:
    url: jdbc:postgresql://localhost:5432/cloudcart_db
    username: postgres
    password: 1234
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: cloudcart-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.cloud_cart.event"
        spring.json.value.default.type: com.example.cloud_cart.event.OrderCreatedEvent
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:YOUR_ACCESS_KEY}
        secret-key: ${AWS_SECRET_ACCESS_KEY:YOUR_SECRET_KEY}
      region:
        static: ap-south-1
      s3:
        bucket: cloudcart-images-2026
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080